<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 20px; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .section-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace; font-size: 11px; }
      .note-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .arrow { stroke: #0284c7; stroke-width: 2; fill: none; }
      .map-arrow { stroke: #8b5cf6; stroke-width: 2; stroke-dasharray: 4,3; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <linearGradient id="grad-frag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="grad-paged" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="grad-block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="960" height="700" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Main Title -->
  <text x="40" y="45" class="title">V1: PagedAttention 显存管理架构对比与原理剖析</text>
  <text x="40" y="68" class="subtitle">传统连续显存预分配 (巨大碎片与浪费) vs PagedAttention 物理分页显存池 (零碎片、按需分配)</text>

  <!-- ================= LEFT: Traditional Contiguous Memory ================= -->
  <g transform="translate(35, 95)">
    <rect x="0" y="0" width="430" height="585" rx="12" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
    <text x="20" y="30" class="section-hdr" fill="#991b1b">传统方案: 连续静态预分配</text>
    <text x="20" y="50" class="note-text">按 max_seq_len (如 2048/4096) 连续静态开辟显存空间</text>

    <!-- Request A -->
    <g transform="translate(20, 75)">
      <text x="0" y="15" class="card-title" fill="#1e293b">Request A (实际使用 120 tokens, 预分配 2048)</text>
      <!-- Used -->
      <rect x="0" y="25" width="40" height="36" rx="4" fill="#86efac" stroke="#22c55e"/>
      <text x="20" y="47" text-anchor="middle" class="label-text" fill="#14532d">Used</text>
      <!-- Reserved / Wasted -->
      <rect x="45" y="25" width="345" height="36" rx="4" fill="url(#grad-frag)" stroke="#ef4444" stroke-dasharray="3,3"/>
      <text x="217" y="47" text-anchor="middle" class="label-text" fill="#991b1b">内部碎片 (Reserved / 未使用但已占用显存 94%)</text>
    </g>

    <!-- Request B -->
    <g transform="translate(20, 160)">
      <text x="0" y="15" class="card-title" fill="#1e293b">Request B (实际使用 260 tokens, 预分配 2048)</text>
      <rect x="0" y="25" width="80" height="36" rx="4" fill="#86efac" stroke="#22c55e"/>
      <text x="40" y="47" text-anchor="middle" class="label-text" fill="#14532d">Used</text>
      <rect x="85" y="25" width="305" height="36" rx="4" fill="url(#grad-frag)" stroke="#ef4444" stroke-dasharray="3,3"/>
      <text x="237" y="47" text-anchor="middle" class="label-text" fill="#991b1b">内部碎片 (预分配浪费 87%)</text>
    </g>

    <!-- Request C -->
    <g transform="translate(20, 245)">
      <text x="0" y="15" class="card-title" fill="#1e293b">Request C (实际使用 50 tokens, 预分配 2048)</text>
      <rect x="0" y="25" width="20" height="36" rx="4" fill="#86efac" stroke="#22c55e"/>
      <text x="10" y="47" text-anchor="middle" font-size="9" fill="#14532d">U</text>
      <rect x="25" y="25" width="365" height="36" rx="4" fill="url(#grad-frag)" stroke="#ef4444" stroke-dasharray="3,3"/>
      <text x="207" y="47" text-anchor="middle" class="label-text" fill="#991b1b">内部碎片 (预分配浪费 97%)</text>
    </g>

    <!-- Analysis box -->
    <g transform="translate(20, 340)">
      <rect x="0" y="0" width="390" height="225" rx="8" fill="#ffffff" stroke="#fca5a5"/>
      <text x="15" y="28" font-family="sans-serif" font-weight="700" font-size="13" fill="#b91c1c">三大致命缺陷：</text>
      
      <text x="15" y="60" class="note-text" font-weight="600" fill="#7f1d1d">1. 内部碎片 (Internal Fragmentation):</text>
      <text x="25" y="80" class="note-text">为了容纳可能变长的回复，必须为每个请求预分配</text>
      <text x="25" y="100" class="note-text">最大长度连续空间，平均 60%~80% 显存被白白闲置。</text>

      <text x="15" y="130" class="note-text" font-weight="600" fill="#7f1d1d">2. 外部碎片 (External Fragmentation):</text>
      <text x="25" y="150" class="note-text">频繁请求生成后释放，导致连续内存出现空洞，</text>
      <text x="25" y="170" class="note-text">总剩余显存充足却无法分配大块连续空间。</text>

      <text x="15" y="200" class="note-text" font-weight="600" fill="#7f1d1d">3. 无法并发扩展：60%~80% 显存被锁定，Batch Size 极小！</text>
    </g>
  </g>

  <!-- ================= RIGHT: PagedAttention Solution ================= -->
  <g transform="translate(485, 95)">
    <rect x="0" y="0" width="460" height="585" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="20" y="30" class="section-hdr" fill="#15803d">vLLM 核心创新: PagedAttention 分页显存池</text>
    <text x="20" y="50" class="note-text">参考 OS 虚拟内存分页思想: 逻辑块 (Logical) → 物理块 (Physical)</text>

    <!-- Logical Blocks & Block Table -->
    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="420" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="15" y="22" class="card-title" fill="#0f172a">Request A 的逻辑空间与 Block Table (block_size = 16)</text>
      
      <!-- Logical blocks row -->
      <g transform="translate(15, 35)">
        <rect x="0" y="0" width="90" height="36" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
        <text x="45" y="18" text-anchor="middle" class="label-text" fill="#0369a1">Logical 0</text>
        <text x="45" y="30" text-anchor="middle" font-size="9" fill="#0284c7">Tokens 0~15</text>

        <rect x="100" y="0" width="90" height="36" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
        <text x="145" y="18" text-anchor="middle" class="label-text" fill="#0369a1">Logical 1</text>
        <text x="145" y="30" text-anchor="middle" font-size="9" fill="#0284c7">Tokens 16~31</text>

        <rect x="200" y="0" width="90" height="36" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
        <text x="245" y="18" text-anchor="middle" class="label-text" fill="#0369a1">Logical 2</text>
        <text x="245" y="30" text-anchor="middle" font-size="9" fill="#0284c7">Tokens 32~47</text>

        <rect x="300" y="0" width="90" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="3,3"/>
        <text x="345" y="18" text-anchor="middle" class="label-text" fill="#64748b">Logical 3</text>
        <text x="345" y="30" text-anchor="middle" font-size="9" fill="#94a3b8">按需申请...</text>
      </g>

      <!-- Block Table mapping -->
      <g transform="translate(15, 88)">
        <rect x="0" y="0" width="390" height="78" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
        <text x="15" y="20" font-family="sans-serif" font-weight="700" font-size="12" fill="#6d28d9">
          Request A 的 Block Table 映射关系:
        </text>
        
        <text x="20" y="44" class="label-text" fill="#5b21b6">Logical 0  ──►  Physical Block #7</text>
        <text x="20" y="64" class="label-text" fill="#5b21b6">Logical 1  ──►  Physical Block #2</text>
        <text x="220" y="44" class="label-text" fill="#5b21b6">Logical 2  ──►  Physical Block #11</text>
        <text x="220" y="64" class="label-text" fill="#9ca3af">Logical 3  ──►  (待新 Token 触发)</text>
      </g>
    </g>

    <!-- Global GPU Physical Pool -->
    <g transform="translate(20, 275)">
      <rect x="0" y="0" width="420" height="290" rx="8" fill="#ffffff" stroke="#86efac"/>
      <text x="15" y="24" class="card-title" fill="#15803d">GPU 全局预分配物理显存池 (GPU Memory Pool)</text>
      <text x="15" y="42" class="note-text">预先开辟一整个大 Tensor: (num_blocks, num_kv_heads, block_size, head_dim)</text>

      <!-- Physical Blocks Grid -->
      <g transform="translate(15, 55)">
        <!-- Block 0 -->
        <rect x="0" y="0" width="85" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="42" y="18" text-anchor="middle" class="label-text" fill="#64748b">Block 0</text>
        <text x="42" y="32" text-anchor="middle" font-size="9" fill="#94a3b8">Free</text>

        <!-- Block 1 -->
        <rect x="100" y="0" width="85" height="42" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
        <text x="142" y="18" text-anchor="middle" class="label-text" fill="#b45309">Block 1</text>
        <text x="142" y="32" text-anchor="middle" font-size="9" fill="#d97706">Req B #0</text>

        <!-- Block 2 (Req A Logical 1) -->
        <rect x="200" y="0" width="85" height="42" rx="4" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
        <text x="242" y="18" text-anchor="middle" class="label-text" fill="#5b21b6">Block 2</text>
        <text x="242" y="32" text-anchor="middle" font-size="9" fill="#6d28d9">Req A (L1)</text>

        <!-- Block 3 -->
        <rect x="300" y="0" width="85" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="342" y="18" text-anchor="middle" class="label-text" fill="#64748b">Block 3</text>
        <text x="342" y="32" text-anchor="middle" font-size="9" fill="#94a3b8">Free</text>

        <!-- Row 2 -->
        <!-- Block 4 -->
        <rect x="0" y="55" width="85" height="42" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
        <text x="42" y="73" text-anchor="middle" class="label-text" fill="#b45309">Block 4</text>
        <text x="42" y="87" text-anchor="middle" font-size="9" fill="#d97706">Req B #1</text>

        <!-- Block 5 -->
        <rect x="100" y="55" width="85" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="142" y="73" text-anchor="middle" class="label-text" fill="#64748b">Block 5</text>
        <text x="142" y="87" text-anchor="middle" font-size="9" fill="#94a3b8">Free</text>

        <!-- Block 6 -->
        <rect x="200" y="55" width="85" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="242" y="73" text-anchor="middle" class="label-text" fill="#64748b">Block 6</text>
        <text x="242" y="87" text-anchor="middle" font-size="9" fill="#94a3b8">Free</text>

        <!-- Block 7 (Req A Logical 0) -->
        <rect x="300" y="55" width="85" height="42" rx="4" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
        <text x="342" y="73" text-anchor="middle" class="label-text" fill="#5b21b6">Block 7</text>
        <text x="342" y="87" text-anchor="middle" font-size="9" fill="#6d28d9">Req A (L0)</text>

        <!-- Row 3 -->
        <!-- Block 8 -->
        <rect x="0" y="110" width="85" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="42" y="128" text-anchor="middle" class="label-text" fill="#64748b">Block 8</text>
        <text x="42" y="142" text-anchor="middle" font-size="9" fill="#94a3b8">Free</text>

        <!-- Block 9 -->
        <rect x="100" y="110" width="85" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="142" y="128" text-anchor="middle" class="label-text" fill="#64748b">Block 9</text>
        <text x="142" y="142" text-anchor="middle" font-size="9" fill="#94a3b8">Free</text>

        <!-- Block 10 -->
        <rect x="200" y="110" width="85" height="42" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
        <text x="242" y="128" text-anchor="middle" class="label-text" fill="#b45309">Block 10</text>
        <text x="242" y="142" text-anchor="middle" font-size="9" fill="#d97706">Req C #0</text>

        <!-- Block 11 (Req A Logical 2) -->
        <rect x="300" y="110" width="85" height="42" rx="4" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
        <text x="342" y="128" text-anchor="middle" class="label-text" fill="#5b21b6">Block 11</text>
        <text x="342" y="142" text-anchor="middle" font-size="9" fill="#6d28d9">Req A (L2)</text>
      </g>

      <!-- Key Benefits summary -->
      <g transform="translate(15, 220)">
        <rect x="0" y="0" width="390" height="58" rx="6" fill="#f0fdf4" stroke="#86efac"/>
        <text x="10" y="20" font-family="sans-serif" font-weight="700" font-size="11" fill="#15803d">
          核心收益: 显存浪费率从 60%~80% 骤降至 4% 以下 (仅最后一个未满 Block 存在微小碎片)
        </text>
        <text x="10" y="38" font-family="sans-serif" font-size="11" fill="#166534">
          支持非连续物理存储、动态申请、支持不同请求间共享 Block (如 Prefix Caching)！
        </text>
      </g>
    </g>
  </g>

</svg>

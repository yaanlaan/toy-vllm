[project]
name = "toy-vllm"
version = "0.1.0"
description = "Build high-performance LLM inference engine from scratch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "accelerate>=0.30.0",
    "tokenizers>=0.19.0",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 20px; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .sec-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; }
      .code-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace; font-size: 11px; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .flow-arrow { stroke: #0284c7; stroke-width: 2; fill: none; }
      .comm-arrow { stroke: #ef4444; stroke-width: 2.2; stroke-dasharray: 4,3; fill: none; }
    </style>
    <marker id="ar-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="ar-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <linearGradient id="g-gpu0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="g-gpu1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="960" height="700" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="45" class="title">V4: Megatron 风格张量并行 (Tensor Parallelism) 算子切分架构</text>
  <text x="40" y="68" class="subtitle">列并行 (ColumnParallel) 与行并行 (RowParallel) 正交融合，单层仅需 2 次 All-Reduce 通信！</text>

  <!-- ================= TOP SECTION: Attention Module TP ================= -->
  <g transform="translate(35, 95)">
    <rect x="0" y="0" width="910" height="260" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="28" class="sec-hdr" fill="#0369a1">1. Self-Attention 层的张量并行设计 (TP = 2 示例)</text>
    
    <!-- Input X -->
    <g transform="translate(20, 60)">
      <rect x="0" y="30" width="80" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="40" y="70" text-anchor="middle" class="code-font" font-weight="700">输入 X</text>
    </g>

    <path d="M 105 125 L 145 95" class="flow-arrow" marker-end="url(#ar-b)"/>
    <path d="M 105 125 L 145 155" class="flow-arrow" marker-end="url(#ar-b)"/>

    <!-- ColumnParallel QKV -->
    <!-- GPU 0 Partition -->
    <g transform="translate(150, 45)">
      <rect x="0" y="0" width="220" height="65" rx="6" fill="url(#g-gpu0)" stroke="#38bdf8"/>
      <text x="15" y="22" font-family="sans-serif" font-weight="700" font-size="11" fill="#0369a1">[GPU 0] 列并行切分</text>
      <text x="15" y="40" class="code-font" fill="#0c4a6e">Q1, K1, V1 投影 (前一半头)</text>
      <text x="15" y="55" font-size="10" fill="#0284c7">Local Attention (无需通信!)</text>
    </g>

    <!-- GPU 1 Partition -->
    <g transform="translate(150, 140)">
      <rect x="0" y="0" width="220" height="65" rx="6" fill="url(#g-gpu1)" stroke="#a78bfa"/>
      <text x="15" y="22" font-family="sans-serif" font-weight="700" font-size="11" fill="#5b21b6">[GPU 1] 列并行切分</text>
      <text x="15" y="40" class="code-font" fill="#4c1d95">Q2, K2, V2 投影 (后一半头)</text>
      <text x="15" y="55" font-size="10" fill="#7c3aed">Local Attention (无需通信!)</text>
    </g>

    <path d="M 375 77 L 415 77" class="flow-arrow" marker-end="url(#ar-b)"/>
    <path d="M 375 172 L 415 172" class="flow-arrow" marker-end="url(#ar-b)"/>

    <!-- RowParallel O Proj -->
    <!-- GPU 0 Out -->
    <g transform="translate(420, 45)">
      <rect x="0" y="0" width="200" height="65" rx="6" fill="url(#g-gpu0)" stroke="#38bdf8"/>
      <text x="15" y="22" font-family="sans-serif" font-weight="700" font-size="11" fill="#0369a1">[GPU 0] 行并行切分</text>
      <text x="15" y="42" class="code-font" fill="#0c4a6e">O1 Proj (按行切分)</text>
      <text x="15" y="58" class="code-font" fill="#0369a1">Y0 = Attn0 @ W_o0</text>
    </g>

    <!-- GPU 1 Out -->
    <g transform="translate(420, 140)">
      <rect x="0" y="0" width="200" height="65" rx="6" fill="url(#g-gpu1)" stroke="#a78bfa"/>
      <text x="15" y="22" font-family="sans-serif" font-weight="700" font-size="11" fill="#5b21b6">[GPU 1] 行并行切分</text>
      <text x="15" y="42" class="code-font" fill="#4c1d95">O2 Proj (按行切分)</text>
      <text x="15" y="58" class="code-font" fill="#5b21b6">Y1 = Attn1 @ W_o1</text>
    </g>

    <!-- Communication Arrow to All-Reduce -->
    <path d="M 625 77 L 675 115" class="comm-arrow" marker-end="url(#ar-r)"/>
    <path d="M 625 172 L 675 135" class="comm-arrow" marker-end="url(#ar-r)"/>

    <!-- All-Reduce Box -->
    <g transform="translate(680, 75)">
      <rect x="0" y="0" width="180" height="100" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <text x="90" y="28" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#b91c1c">All-Reduce (Sum)</text>
      <text x="90" y="52" text-anchor="middle" class="code-font" fill="#991b1b">Y = Y0 + Y1</text>
      <rect x="15" y="65" width="150" height="24" rx="4" fill="#fee2e2"/>
      <text x="90" y="81" text-anchor="middle" font-size="10" fill="#7f1d1d" font-weight="600">全层仅此处需通信 1 次</text>
    </g>
  </g>

  <!-- ================= BOTTOM SECTION: MLP Module TP ================= -->
  <g transform="translate(35, 375)">
    <rect x="0" y="0" width="910" height="260" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="20" y="28" class="sec-hdr" fill="#15803d">2. MLP (SwiGLU) 层的张量并行设计 (TP = 2 示例)</text>

    <!-- Input X -->
    <g transform="translate(20, 60)">
      <rect x="0" y="30" width="80" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="40" y="70" text-anchor="middle" class="code-font" font-weight="700">输入 X</text>
    </g>

    <path d="M 105 125 L 145 95" class="flow-arrow" marker-end="url(#ar-b)"/>
    <path d="M 105 125 L 145 155" class="flow-arrow" marker-end="url(#ar-b)"/>

    <!-- ColumnParallel Gate/Up -->
    <!-- GPU 0 Partition -->
    <g transform="translate(150, 45)">
      <rect x="0" y="0" width="220" height="65" rx="6" fill="url(#g-gpu0)" stroke="#38bdf8"/>
      <text x="15" y="22" font-family="sans-serif" font-weight="700" font-size="11" fill="#0369a1">[GPU 0] 列并行切分</text>
      <text x="15" y="40" class="code-font" fill="#0c4a6e">Gate0, Up0 投影 (D/2 隐层)</text>
      <text x="15" y="55" font-size="10" fill="#0284c7">Local SwiGLU (无需通信!)</text>
    </g>

    <!-- GPU 1 Partition -->
    <g transform="translate(150, 140)">
      <rect x="0" y="0" width="220" height="65" rx="6" fill="url(#g-gpu1)" stroke="#a78bfa"/>
      <text x="15" y="22" font-family="sans-serif" font-weight="700" font-size="11" fill="#5b21b6">[GPU 1] 列并行切分</text>
      <text x="15" y="40" class="code-font" fill="#4c1d95">Gate1, Up1 投影 (D/2 隐层)</text>
      <text x="15" y="55" font-size="10" fill="#7c3aed">Local SwiGLU (无需通信!)</text>
    </g>

    <path d="M 375 77 L 415 77" class="flow-arrow" marker-end="url(#ar-b)"/>
    <path d="M 375 172 L 415 172" class="flow-arrow" marker-end="url(#ar-b)"/>

    <!-- RowParallel Down Proj -->
    <!-- GPU 0 Down -->
    <g transform="translate(420, 45)">
      <rect x="0" y="0" width="200" height="65" rx="6" fill="url(#g-gpu0)" stroke="#38bdf8"/>
      <text x="15" y="22" font-family="sans-serif" font-weight="700" font-size="11" fill="#0369a1">[GPU 0] 行并行切分</text>
      <text x="15" y="42" class="code-font" fill="#0c4a6e">Down0 Proj (按行切分)</text>
      <text x="15" y="58" class="code-font" fill="#0369a1">M0 = SwiGLU0 @ W_down0</text>
    </g>

    <!-- GPU 1 Down -->
    <g transform="translate(420, 140)">
      <rect x="0" y="0" width="200" height="65" rx="6" fill="url(#g-gpu1)" stroke="#a78bfa"/>
      <text x="15" y="22" font-family="sans-serif" font-weight="700" font-size="11" fill="#5b21b6">[GPU 1] 行并行切分</text>
      <text x="15" y="42" class="code-font" fill="#4c1d95">Down1 Proj (按行切分)</text>
      <text x="15" y="58" class="code-font" fill="#5b21b6">M1 = SwiGLU1 @ W_down1</text>
    </g>

    <path d="M 625 77 L 675 115" class="comm-arrow" marker-end="url(#ar-r)"/>
    <path d="M 625 172 L 675 135" class="comm-arrow" marker-end="url(#ar-r)"/>

    <!-- All-Reduce Box -->
    <g transform="translate(680, 75)">
      <rect x="0" y="0" width="180" height="100" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <text x="90" y="28" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#b91c1c">All-Reduce (Sum)</text>
      <text x="90" y="52" text-anchor="middle" class="code-font" fill="#991b1b">M = M0 + M1</text>
      <rect x="15" y="65" width="150" height="24" rx="4" fill="#fee2e2"/>
      <text x="90" y="81" text-anchor="middle" font-size="10" fill="#7f1d1d" font-weight="600">全层仅此处需通信 1 次</text>
    </g>
  </g>

  <!-- Footnote -->
  <text x="40" y="665" font-family="sans-serif" font-size="12" fill="#047857" font-weight="700">
    核心精妙之处：ColumnParallel 与 RowParallel 相互咬合，把中间的 Attention 和 SwiGLU 激活变成了完全本地的私有计算，通信量最小化！
  </text>
</svg>

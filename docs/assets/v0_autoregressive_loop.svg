<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 20px; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .token-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace; font-size: 12px; font-weight: 600; }
      .note-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .arrow { stroke: #0284c7; stroke-width: 2; fill: none; }
      .loop-back { stroke: #ef4444; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="900" height="600" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="40" y="45" class="title">V0: 极简自回归推理循环 (Naive Autoregressive Generation)</text>
  <text x="40" y="68" class="subtitle">无 KV Cache 状态下每次完整重算历史上下文的过程分析（计算复杂度 O(N²) 的根源）</text>

  <!-- Step 0: Input Prompt -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="820" height="85" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="26" class="step-title">Step 0: 用户 Prompt 输入 (Token 化)</text>
    
    <g transform="translate(20, 38)">
      <rect x="0" y="0" width="65" height="32" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
      <text x="32" y="20" text-anchor="middle" class="token-text" fill="#0369a1">"你"</text>
      <rect x="75" y="0" width="65" height="32" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
      <text x="107" y="20" text-anchor="middle" class="token-text" fill="#0369a1">"好"</text>
      <rect x="150" y="0" width="65" height="32" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
      <text x="182" y="20" text-anchor="middle" class="token-text" fill="#0369a1">"，"</text>
      <text x="240" y="21" class="note-text">长度 L = 3。初始 token_ids: [108, 92, 12]</text>
    </g>
  </g>

  <!-- Step 1: Prefill Forward -->
  <g transform="translate(40, 200)">
    <rect x="0" y="0" width="820" height="110" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="20" y="26" class="step-title">Step 1: 首次前向计算 (Prefill 阶段)</text>
    
    <g transform="translate(20, 38)">
      <rect x="0" y="0" width="220" height="32" rx="6" fill="#bbf7d0" stroke="#22c55e"/>
      <text x="110" y="20" text-anchor="middle" class="token-text" fill="#14532d">输入: ["你", "好", "，"] (3 tokens)</text>
      
      <text x="245" y="21" font-size="16" fill="#16a34a">→</text>

      <rect x="275" y="0" width="220" height="32" rx="6" fill="#ffffff" stroke="#22c55e"/>
      <text x="385" y="20" text-anchor="middle" class="token-text" fill="#15803d">Transformer Forward (全量)</text>

      <text x="515" y="21" font-size="16" fill="#16a34a">→</text>

      <rect x="545" y="0" width="220" height="32" rx="6" fill="#fef08a" stroke="#ca8a04"/>
      <text x="655" y="20" text-anchor="middle" class="token-text" fill="#854d0e">采得 Token 1: "我"</text>
    </g>
    <text x="20" y="95" class="note-text">提取 logits[:, -1, :] 最后一个位置进行采样，产生第一个生成 token。</text>
  </g>

  <!-- Step 2: Decode step 1 (Naive Concat) -->
  <g transform="translate(40, 330)">
    <rect x="0" y="0" width="820" height="110" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <text x="20" y="26" class="step-title">Step 2: 自回归生成第 2 个 Token (V0 拼接机制)</text>
    
    <g transform="translate(20, 38)">
      <rect x="0" y="0" width="290" height="32" rx="6" fill="#fed7aa" stroke="#f97316"/>
      <text x="145" y="20" text-anchor="middle" class="token-text" fill="#7c2d12">输入: ["你", "好", "，", "我"] (4 tokens)</text>
      
      <text x="310" y="21" font-size="16" fill="#f97316">→</text>

      <rect x="330" y="0" width="220" height="32" rx="6" fill="#ffffff" stroke="#f97316"/>
      <text x="440" y="20" text-anchor="middle" class="token-text" fill="#c2410c">Transformer Forward (从头重算!)</text>

      <text x="565" y="21" font-size="16" fill="#f97316">→</text>

      <rect x="585" y="0" width="180" height="32" rx="6" fill="#fef08a" stroke="#ca8a04"/>
      <text x="675" y="20" text-anchor="middle" class="token-text" fill="#854d0e">采得 Token 2: "是"</text>
    </g>
    <text x="20" y="95" font-family="sans-serif" font-size="12" fill="#b45309" font-weight="600">
      严重性能冗余：前 3 个 token 的 K、V 矩阵在第 1 步已经算过，但 V0 没有缓存，必须第 2 步重新计算！
    </text>
  </g>

  <!-- Step 3: Loop Back & Terminate -->
  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="820" height="110" rx="10" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5"/>
    <text x="20" y="26" class="step-title">Step 3: 循环迭代 直至遇到终止符 (EOS Token / 最大步长)</text>
    <text x="20" y="55" class="note-text">序列持续变长：[你, 好, ，, 我, 是] → [你, 好, ，, 我, 是, Q] → ...</text>
    <text x="20" y="78" class="note-text">
      当生成的 next_token_id == eos_token_id 或达到 max_new_tokens 时，退出循环。
    </text>
    <text x="20" y="98" font-family="sans-serif" font-size="12" fill="#be185d" font-weight="700">
      V0 的价值：零显存管理包袱，以最直接的代码验证模型权重和算子数学正确性！
    </text>
  </g>

  <!-- Loop back curved arrow -->
  <path d="M 860 380 Q 900 300 860 250" class="loop-back" marker-end="url(#ar-red)"/>
  <text x="830" y="300" font-family="sans-serif" font-size="11" fill="#ef4444" font-weight="600">循环追加</text>

</svg>
